pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx}"
      run: bun lint {staged_files}
      stage_fixed: true
    format:
      glob: "*.{ts,tsx,json,md}"
      run: bun format {staged_files}
      stage_fixed: true
    test:
      glob: "*.{ts,tsx}"
      run: bunx vitest related {staged_files} --run --reporter=verbose --bail=1
    test-ct:
      glob: "**/*.ct.tsx"
      run: bunx playwright test -c playwright-ct.config.ts {staged_files}
    react-doctor:
      glob: "*.{tsx}"
      run: bun react-doctor --scope changed < /dev/null
